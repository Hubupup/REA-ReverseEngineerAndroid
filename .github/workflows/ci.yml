name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Optional exact revision to validate.
        required: false
        type: string
      remote_cache_write:
        description: Compatibility input for release qualification.
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        description: Optional remote cache token.
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify worker package import aliases
        run: >-
          node --input-type=module -e
          "for (const id of ['#javascript-analysis-worker', '#web-bundle-analysis-worker']) { const target = import.meta.resolve(id); if (!target.includes('/dist/')) throw new Error(id + ': ' + target); }"
      - run: npm run check:fast
      - run: npm run verify:test-discovery
      - run: npm run knip:production

  docs:
    name: Documentation and package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/run-turbo.mjs run artifacts:skills artifacts:product-catalog
      - run: npm run docs:check:built
      - run: npm run test:local -- tests/conformance/readmeConsistency.test.ts
      - run: npx vitest run tests/boundary/filesystem/documentationFacts.test.ts

  android_contracts:
    name: Android contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          src/contracts/androidToolAllowlist.test.ts
          src/contracts/toolFamilies.test.ts

  required:
    name: CI required
    if: always()
    needs: [static, docs, android_contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Android-only CI jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CONTRACTS_RESULT: ${{ needs.android_contracts.result }}
        run: |
          test "${STATIC_RESULT}" = "success"
          test "${DOCS_RESULT}" = "success"
          test "${CONTRACTS_RESULT}" = "success"
